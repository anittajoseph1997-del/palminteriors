
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PALM | Design • Manufacture • Build</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@100;200;300;400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --stone-50: #f9f8f6;
        --stone-900: #1a1918;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--stone-50);
        color: var(--stone-900);
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3, .serif {
        font-family: 'Playfair Display', serif;
      }
      .luxury-transition {
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .fade-in {
        animation: fadeIn 1.2s ease-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: var(--stone-50);
      }
      ::-webkit-scrollbar-thumb {
        background: #d6d3d1;
      }
      .text-reveal {
        overflow: hidden;
      }
      .text-reveal span {
        display: inline-block;
        transform: translateY(100%);
        animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes reveal {
        to { transform: translateY(0); }
      }
    </style>
  <script type="importmap">

}
</script>
</head>

    <div id="root"></div>
  </body>
</html>
